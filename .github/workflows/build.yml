name: Build libchat
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK=$NDK"
          ls "$NDK" | head -5
          cmake --version

      - name: Get llama.cpp
        run: |
          TAG=""
          for n in $(seq 5500 5800); do
            code=$(curl -s -o /dev/null -I -L -w "%{http_code}" "https://github.com/ggml-org/llama.cpp/archive/refs/tags/b$n.tar.gz")
            if [ "$code" = "200" ]; then TAG="b$n"; break; fi
          done
          if [ -z "$TAG" ]; then
            echo "لم أجد نسخة في النطاق، سأستعمل آخر إصدار رسمي"
            TAG=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          fi
          echo "استعمال النسخة: $TAG"
          curl -sL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/archive/refs/tags/$TAG.tar.gz"
          mkdir llama-src
          tar xzf llama.tar.gz -C llama-src --strip-components=1
          ls llama-src | head

      - name: Build arm64-v8a
        id: v8
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          ABI=arm64-v8a
          cmake -S native -B "build-$ABI" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_LLAMA="$PWD/llama-src"
          if ! cmake --build "build-$ABI" --config Release -j 4; then
            echo "=============== FIRST ERRORS ==============="
            cmake --build "build-$ABI" --config Release -j 1 2>&1 | grep -n -E "error|Error|undefined" -A4 | head -80
            exit 1
          fi
          mkdir -p "out/$ABI"
          cp "build-$ABI/libchat.so" "out/$ABI/libchat.so"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "out/$ABI/libchat.so"

      - name: Build armeabi-v7a (optional)
        id: v7
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          ABI=armeabi-v7a
          cmake -S native -B "build-$ABI" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_LLAMA="$PWD/llama-src"
          if ! cmake --build "build-$ABI" --config Release -j 4; then
            echo "=============== FIRST ERRORS ==============="
            cmake --build "build-$ABI" --config Release -j 1 2>&1 | grep -n -E "error|Error|undefined" -A4 | head -80
            exit 1
          fi
          mkdir -p "out/$ABI"
          cp "build-$ABI/libchat.so" "out/$ABI/libchat.so"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "out/$ABI/libchat.so"

      - name: Result
        if: always()
        run: |
          echo "arm64-v8a : ${{ steps.v8.outcome }}"
          echo "armeabi-v7a: ${{ steps.v7.outcome }}"
          ls -laR out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libchat-android
          path: out
          if-no-files-found: warn
