name: Build libchat
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libchat.so (arm64-v8a + armeabi-v7a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for ABI in arm64-v8a armeabi-v7a; do
            echo "=== Building $ABI ==="
            cmake -S native -B "build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
              -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
              -DFETCHCONTENT_BASE_DIR="$PWD/_deps"
            cmake --build "build-$ABI" --config Release -j 4
            mkdir -p "out/$ABI"
            cp "build-$ABI/libchat.so" "out/$ABI/libchat.so"
            "$STRIP" "out/$ABI/libchat.so"
          done
          ls -laR out
      - uses: actions/upload-artifact@v4
        with:
          name: libchat-android
          path: out

