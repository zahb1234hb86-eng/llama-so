name: build-so
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone llama.cpp
        run: git clone --depth 1 --branch b5200 https://github.com/ggml-org/llama.cpp llama.cpp
      - name: Build arm64-v8a
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod -O3" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod -O3" \
            -DGGML_LLAMAFILE=OFF
          cmake --build build -j4
          mkdir -p out/arm64-v8a
          find build -name "*.so" -exec cp {} out/arm64-v8a/ \;
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/arm64-v8a/*.so
          ls -la out/arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: mura-so-arm64-v8a
          path: out/
