name: build-so
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - name: Clone llama.cpp
        run: git clone --depth 1 --branch b5200 https://github.com/ggml-org/llama.cpp llama.cpp
      - name: Build ${{ matrix.abi }}
        run: |
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            FLAGS="-march=armv8.2-a+dotprod -O3"
          else
            FLAGS="-O3"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$FLAGS" \
            -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DGGML_LLAMAFILE=OFF
          cmake --build build -j4
          mkdir -p out/${{ matrix.abi }}
          find build -name "*.so" -exec cp {} out/${{ matrix.abi }}/ \;
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/${{ matrix.abi }}/*.so
          ls -la out/${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: mura-so-${{ matrix.abi }}
          path: out/
